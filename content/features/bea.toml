# The tour's lessons on Bea's newer features (records, else guards,
# @derive, functions through types, bea test). scripts/sync-examples.sh
# builds this project with the real bea, then saves each lesson's
# generated Gleam and output in generated/.
name = "features"
version = "1.0.0"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
