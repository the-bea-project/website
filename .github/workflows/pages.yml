name: Deploy to GitHub Pages

# The site is a Bea project. This installs the latest bea release (a
# standalone Linux binary) and Gleam, renders every page with `bea run` on
# Node, and publishes dist/. The examples' generated Gleam and output are
# committed (scripts/sync-examples.sh), so the build needs nothing else.
# In the repository settings, set Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the latest released bea
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bea" \
            https://github.com/the-bea-project/bea/releases/latest/download/bea-linux-amd64
          chmod +x "$HOME/.local/bin/bea"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: pages
        uses: actions/configure-pages@v5

      # Builds the site (and its browser modules) for JavaScript, then runs
      # it: every page is rendered into dist/. The base path (e.g. /website)
      # is only needed by 404.html.
      - name: Build the site
        run: bea run
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
